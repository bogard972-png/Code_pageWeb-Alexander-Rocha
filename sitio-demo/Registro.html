<main>

   <form action="#">

    <fieldset><!--contenedor de los elementos del furmulario-->
        <legend>informacion personal</legend><!--legend: titulo del fielset-->
        <p>
            <label for="nombre">nombre</label>

        </p>

            <input typa-"email" id="correo" name="correo" raquired> chr> <br>

   </form>

    </p>

    </p>
