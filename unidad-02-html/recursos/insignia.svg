<svg width="200" height="200" viewBox="0 0 200" xmlns="http://www.w3.org/2000/svg">

                    <!-- Circle: se ubica por su CENTRO (cx, cy) y su RADIO (r) -->
                    <circle cx="100" cy="100" r="90" fill="#C55A11"></circle> <!-- Fill: color de relleno -->


                    <circle cx="100" cy="100" r="72" fill="#FFF8E1" stroke="#1F4E79"></circle>
                   
                    <!-- polygon: lista de vertices; la figura se cierra sola -->
                    <polygon points="100,45 112,80 149,80 119,102 130,137 100,115 70,137 81,102 51,80 88,80" fill="#F5C518">
                        Fill="#F5C518"
                        stroke="#F5C518"
                        stroke-width="2"/&gt;

                        <!--text código para crear texto svg-->
                        <text x="100" y="170" text-anchor="middle" font-size="14" fill="#1F4E79">
                            html
                        </text>
                </polygon></svg>